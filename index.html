<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vaishnavi Venkatesh — Portfolio</title>

    <link rel="preconnect" href="https\://fonts.googleapis.com" />

    <link rel="preconnect" href="https\://fonts.gstatic.com" crossorigin />

    <link

      href="https\://fonts.googleapis.com/css2?family=Special+Elite&display=swap"

      rel="stylesheet"

    />

    <style>/* ===== VAISHNAVI VENKATESH PORTFOLIO: styles =====

   Each section below starts with a "=====" comment. */

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

}

:root {

  --ink: #0b1b3a;

  --pad: clamp(22px, 6vw, 90px);

  --line: rgba(11, 27, 58, 0.28);

  --mute: rgba(11, 27, 58, 0.65);

}

html {

  scroll-behavior: smooth;

}

body {

  font-size: 9.6px;

  background: #fff;

  color: var(--ink);

  font-family: "Special Elite", "Courier New", monospace;

  line-height: 1.55;

  overflow-x: hidden;

  animation: fadein 0.8s both;

}

@keyframes fadein {

  from {

    opacity: 0;

  }

}

a {

  color: inherit;

  text-decoration: none;

}

img {

  display: block;

  max-width: 100%;

}

::selection {

  background: var(--ink);

  color: #fff;

}

:focus-visible {

  outline: 2px dashed var(--ink);

  outline-offset: 4px;

}



/* ===== BASE: colours, labels, shared bits ===== */

.label {

  font-size: 7.8px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

}

.hatch {

  background: repeating-linear-gradient(45deg, #fff 0 9px, #eef0f5 9px 18px);

}



/* cursor */

@media (hover: hover) and (pointer: fine) {

  html.has-cursor,

  html.has-cursor * {

    cursor: none !important;

  }

}



/* ===== CURSOR ===== */

.cursor {

  position: fixed;

  left: 0;

  top: 0;

  width: 16px;

  height: 16px;

  border-radius: 50%;

  background: var(--ink);

  pointer-events: none;

  z-index: 9999;

  opacity: 0;

  transition:

    width 0.3s,

    height 0.3s,

    opacity 0.3s,

    *background* 0.3s;

}

html:not(.has-cursor) .cursor {

  display: none;

}



/* header: logo/picture left, stacked nav right */



/* ===== HEADER: logo and navigation ===== */

.site-head {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  padding: 24px var(--pad);

  z-index: 50;

}

.logo img {

  width: 64px;

  height: 64px;

  object-fit: cover;

  border-radius: 50%;

  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);

}

.logo:hover img {

  transform: rotate(-12deg) scale(1.06);

}

.site-nav ul {

  list-style: none;

  text-align: right;

}

.site-nav a {

  display: inline-block;

  position: relative;

  font-size: 11.4px;

  padding: 3px 0;

}

.site-nav a::after {

  content: "";

  position: absolute;

  left: 0;

  right: 0;

  bottom: 2px;

  height: 1.5px;

  background: var(--ink);

  transform: scaleX(0);

  transform-origin: right;

  transition: transform 0.35s;

}

.site-nav a:hover::after,

.site-nav a.on::after {

  transform: scaleX(1);

  transform-origin: left;

}



/* reveal */



/* ===== SCROLL REVEAL ===== */

.reveal {

  opacity: 0;

  transform: translateY(26px);

  transition:

    opacity 0.9s ease,

    transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);

}

.reveal.in {

  opacity: 1;

  transform: none;

}



/* intro */



/* ===== HOME: INTRO ===== */

.intro {

  position: relative;

  min-height: 100vh;

  padding: 150px var(--pad) 100px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  overflow: hidden;

}

.intro .txt {

  position: relative;

  z-index: 2;

  max-width: 640px;

}

.hello {

  font-weight: 400;

  font-size: clamp(27.6px, 5.4vw, 84px);

  line-height: 1;

  letter-spacing: -0.03em;

}

.hello #hi {

  display: inline-block;

  transition:

    opacity 0.2s,

    transform 0.2s;

}

.hello .name {

  display: block;

  font-size: 0.6em;

  margin-top: 0.15em;

}

.role {

  margin-top: 30px;

  font-size: clamp(12px, 1.5vw, 20.4px);

  line-height: 1.3;

  max-width: 26ch;

}

.smile {

  position: absolute;

  right: var(--pad);

  bottom: 44px;

  width: 86px;

  height: 86px;

  z-index: 3;

  transition: transform 0.4s;

}

.smile:hover {

  transform: scale(1.12) rotate(8deg);

}

.lotus {

  position: absolute;

  left: var(--pad);

  bottom: 48px;

  width: 52px;

  z-index: 3;

}

.smile svg,

.lotus svg {

  width: 100%;

  height: 100%;

  fill: none;

  stroke: var(--ink);

  stroke-width: 2.5;

  stroke-linecap: round;

}



/* work */



/* ===== WORK GRID ===== */

.work {

  padding: 80px var(--pad) 120px;

}

.work h2,

.slice h2 {

  font-weight: 400;

  font-size: clamp(24px, 4.2vw, 60px);

  line-height: 1;

  letter-spacing: -0.03em;

  margin-bottom: 44px;

}

/* ===== WORK SHOWCASE: projects stacked, picture left and details right ===== */

.showcase {

  display: flex;

  flex-direction: column;

  gap: clamp(50px, 10vh, 120px);

}

.proj {

  display: grid;

  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);

  gap: clamp(28px, 5vw, 72px);

  align-items: center;

  min-height: 70vh;

  opacity: 0;

  transform: translateY(70px);

  transition:

    opacity 0.8s ease,

    transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);

}

.proj.in {

  opacity: 0.28; /* the projects before and after stay a bit transparent */

  transform: none;

}

.proj.active,

.proj.in:hover {

  opacity: 1; /* the project in the middle of the screen is solid */

}

.proj-pic {

  position: relative;

  aspect-ratio: 4/3;

  border: 2px solid var(--ink);

  overflow: hidden;

}

.proj-pic img {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  transition:

    opacity 0.45s,

    transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);

}

.proj-pic img.b {

  opacity: 0;

}

.proj:hover .proj-pic img.a {

  transform: scale(1.04);

}

.proj:hover .proj-pic.has-b img.a {

  opacity: 0;

}

.proj:hover .proj-pic.has-b img.b {

  opacity: 1;

  transform: scale(1.04);

}

.proj-info {

  display: flex;

  flex-direction: column;

  align-items: flex-start;

}

.proj-num {

  font-size: 10px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

}

.proj-info h3 {

  font-weight: 400;

  font-size: clamp(22px, 3.2vw, 44px);

  line-height: 1.05;

  letter-spacing: -0.02em;

  margin: 12px 0 16px;

  transition: color 0.25s;

}

.proj:hover h3 {

  color: var(--hot);

}

.proj-info .pitch {

  font-size: 12px;

  max-width: 42ch;

}

.facts {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px 24px;

  width: 100%;

  margin-top: 22px;

}

.facts div {

  border-top: 1px solid var(--line);

  padding-top: 6px;

}

.facts dt {

  font-size: 9px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

}

.facts dd {

  font-size: 11px;

}



/* slice of life folder */



/* ===== HOME: SLICE OF LIFE FOLDER ===== */

.slice {

  padding: 40px var(--pad) 40px;

  overflow: hidden;

}

.slice .note {

  color: var(--mute);

  margin: -24px 0 20px;

}

.folder {

  position: relative;

  max-width: 920px;

  height: clamp(440px, 64vw, 660px);

  margin: 0 auto;

}

.f-back,

.f-front {

  position: absolute;

  display: block;

}

.f-back {

  left: 6%;

  right: 6%;

  bottom: 0;

  height: 64%;

  z-index: 1;

}

.f-front {

  left: 3%;

  right: 3%;

  bottom: 0;

  height: 46%;

  z-index: 3;

}

.f-back svg,

.f-front svg {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  fill: #fff;

  stroke: var(--ink);

  stroke-width: 3;

  stroke-linejoin: round;

}

.f-label {

  position: absolute;

  inset: 0;

  display: grid;

  place-items: center;

  text-align: center;

  z-index: 2;

  font-size: clamp(14.4px, 2.52vw, 31.2px);

  line-height: 1.1;

  padding-top: 8%;

}

.f-photos {

  position: absolute;

  inset: 0;

  z-index: 2;

  pointer-events: none;

}

.f-ph {

  position: absolute;

  left: 50%;

  bottom: 30%;

  width: clamp(120px, 18vw, 190px);

  aspect-ratio: 4/3;

  border: 2px solid var(--ink);

  background: #fff;

  overflow: hidden;

  will-change: transform;

  box-shadow: 5px 5px 0 rgba(11, 27, 58, 0.15);

}

.f-ph img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}



/* inner pages */



/* ===== INNER PAGES: titles and experiments ===== */

.page-hero {

  padding: 190px var(--pad) 50px;

}

.page-hero h1 {

  font-weight: 400;

  font-size: clamp(31.2px, 6.6vw, 108px);

  line-height: 0.92;

  letter-spacing: -0.04em;

  margin-top: 16px;

}

.page-hero p {

  margin-top: 26px;

  color: var(--mute);

  max-width: 46ch;

}

.whatif {

  font-size: clamp(12px, 1.56vw, 21.6px);

  line-height: 1.25;

  margin-top: 26px;

  max-width: 30ch;

}

.play-grid {

  display: grid;

  grid-template-columns: repeat(3, minmax(0, 1fr));

  gap: 24px;

  padding: 30px var(--pad) 120px;

}

.play {

  aspect-ratio: 1;

  border: 2px solid var(--ink);

  padding: 22px;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  transition:

    *background* 0.35s,

    color 0.35s;

}

.play:hover {

  background: var(--ink);

  color: #fff;

}

.play:hover .label,

.play:hover p {

  color: #fff;

}

.play h3 {

  font-weight: 400;

  font-size: clamp(14.4px, 1.8vw, 24px);

  line-height: 1.05;

}

.play p {

  font-size: 9px;

  color: var(--mute);

  margin-top: 8px;

}



/* case study */



/* ===== CASE STUDY PAGES ===== */

.meta {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 24px;

  padding: 0 var(--pad) 48px;

}

.meta div {

  border-top: 2px solid var(--ink);

  padding-top: 10px;

}

.meta b {

  display: block;

  font-weight: 400;

  font-size: 10.8px;

  margin-top: 2px;

}

.case-img {

  margin: 0 var(--pad);

  border: 2px solid var(--ink);

  aspect-ratio: 16/9;

  overflow: hidden;

}

.case-img img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.sec {

  display: grid;

  grid-template-columns: 1fr 2fr;

  gap: 40px;

  padding: 90px var(--pad) 0;

}

.sec h2 {

  font-weight: 400;

  font-size: 8.4px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

}

.sec p {

  font-size: clamp(12px, 1.38vw, 19.2px);

  line-height: 1.35;

  max-width: 34ch;

}

.sec p.mute {

  color: var(--mute);

}

.ph {

  margin: 36px var(--pad) 0;

  aspect-ratio: 21/9;

  border: 2px dashed var(--line);

  display: grid;

  place-items: center;

  color: var(--mute);

  font-size: 8.4px;

  letter-spacing: 0.12em;

  text-transform: uppercase;

}

.pn {

  display: grid;

  grid-template-columns: 1fr 1fr;

  border-top: 2px solid var(--ink);

  margin-top: 120px;

}

.pn a {

  padding: 48px var(--pad);

  font-size: clamp(13.2px, 1.92vw, 26.4px);

  line-height: 1.1;

  transition:

    *background* 0.35s,

    color 0.35s;

}

.pn a + a {

  text-align: right;

  border-left: 2px solid var(--ink);

}

.pn a:hover {

  background: var(--ink);

  color: #fff;

}

.pn small {

  display: block;

  font-size: 7.8px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

  margin-bottom: 8px;

}

.pn a:hover small {

  color: #fff;

}



/* connect / footer */



/* ===== FOOTER (connect) ===== */

.foot {

  border-top: 2px solid var(--ink);

  padding: 90px var(--pad) 30px;

  text-align: center;

}

.foot h2 {

  font-weight: 400;

  font-size: clamp(27.6px, 5.4vw, 84px);

  line-height: 1;

  letter-spacing: -0.03em;

}

.foot p {

  margin-top: 18px;

  font-size: clamp(12px, 1.56vw, 20.4px);

}

.foot .mail {

  display: inline-block;

  margin-top: 14px;

  font-size: clamp(9.6px, 1.2vw, 15.6px);

  border-bottom: 1.5px solid var(--ink);

  word-break: break-all;

}

.foot-row {

  display: flex;

  justify-content: space-between;

  flex-wrap: wrap;

  gap: 14px 30px;

  margin-top: 80px;

  padding-top: 20px;

  border-top: 1px solid var(--line);

  font-size: 10.2px;

  text-align: left;

}

.foot-row div {

  display: flex;

  flex-wrap: wrap;

  gap: 8px 28px;

}

.foot-row a:hover {

  text-decoration: underline;

  text-underline-offset: 5px;

}



/* entry */



@keyframes rise {

  from {

    opacity: 0;

    transform: translateY(60px);

  }

}

@keyframes spin {

  to {

    transform: rotate(360deg);

  }

}

.curtain {

  position: fixed;

  inset: 0;

  background: var(--ink);

  z-index: 9998;

  transform: translateY(101%);

  transition: transform 0.7s cubic-bezier(0.7, 0, 0.2, 1);

  pointer-events: none;

}

.curtain.on {

  transform: none;

}



@media (max-width: 900px) {

  .proj {

    grid-template-columns: 1fr;

    min-height: 0;

    gap: 20px;

  }

  .play-grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .meta {

    grid-template-columns: repeat(2, 1fr);

  }

  .sec {

    grid-template-columns: 1fr;

    gap: 16px;

  }

}

@media (max-width: 560px) {

  .play-grid {

    grid-template-columns: 1fr;

  }

  .pn {

    grid-template-columns: 1fr;

  }

  .pn a + a {

    border-left: 0;

    border-top: 2px solid var(--ink);

    text-align: left;

  }

  .logo img {

    width: 54px;

    height: 54px;

  }

  .smile {

    width: 64px;

    height: 64px;

  }

}

@media (prefers-reduced-motion: reduce) {

  * {

    animation-duration: 0.001s !important;

    transition: none !important;

  }

  .proj,

  .reveal {

    opacity: 1;

    transform: none;

  }

  html {

    scroll-behavior: auto;

  }

}



/* ---------- slice of life: desk of widgets ---------- */

.board {

  display: grid;

  grid-template-columns: repeat(12, minmax(0, 1fr));

  gap: 34px 28px;

  padding: 30px var(--pad) 130px;

  align-items: start;

}

.w {

  position: relative;

  border: 2px solid var(--ink);

  background: #fff;

  padding: 24px;

  box-shadow: 8px 8px 0 var(--ink);

  transition:

    transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),

    box-shadow 0.4s;

}

.w::before {

  content: "";

  position: absolute;

  top: -13px;

  left: 50%;

  width: 84px;

  height: 24px;

  margin-left: -42px;

  background: rgba(11, 27, 58, 0.14);

  transform: rotate(-3deg);

}

.w:hover {

  transform: translate(-3px, -3px) rotate(0) !important;

  box-shadow: 12px 12px 0 var(--ink);

}

.w h3 {

  font-weight: 400;

  font-size: 7.8px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

  color: var(--mute);

  margin-bottom: 14px;

}

.w-notice {

  grid-column: span 7;

  transform: rotate(-1deg);

}

.w-play {

  grid-column: span 5;

  transform: rotate(1.5deg);

}

.w-todo {

  grid-column: span 4;

  transform: rotate(1deg);

}

.w-count {

  grid-column: span 4;

  transform: rotate(-1.5deg);

}

.w-chai {

  grid-column: span 4;

  transform: rotate(1deg);

}

.w-mem {

  grid-column: span 6;

  transform: rotate(-1deg);

}

.w-slip {

  grid-column: span 6;

  transform: rotate(1.2deg);

}

.notice-big {

  font-size: clamp(18px, 3vw, 40.8px);

  line-height: 1.08;

  letter-spacing: -0.02em;

  min-height: 2.3em;

}

.notice-big span {

  display: inline-block;

  border-bottom: 3px solid var(--ink);

  transition:

    opacity 0.25s,

    transform 0.25s;

}

.notice-big span.out {

  opacity: 0;

  transform: translateY(10px);

}



.tape {

  display: block;

  width: 100%;

  height: auto;

  margin-bottom: 12px;

  fill: none;

  stroke: var(--ink);

  stroke-width: 3;

  stroke-linejoin: round;

}

.reel {

  transform-box: fill-box;

  transform-origin: center;

}

.w-play.on .reel {

  animation: spin 3s linear infinite;

}

.track-name {

  font-size: 12px;

}

.track-by {

  color: var(--mute);

  font-size: 9px;

}

.bar {

  height: 8px;

  border: 2px solid var(--ink);

  margin: 14px 0 6px;

}

.bar i {

  display: block;

  height: 100%;

  width: 0;

  background: var(--ink);

}

.times {

  display: flex;

  justify-content: space-between;

  font-size: 7.8px;

  color: var(--mute);

}

.btn {

  margin-top: 14px;

  border: 2px solid var(--ink);

  padding: 6px 18px;

  font: inherit;

  background: #fff;

  color: var(--ink);

  cursor: pointer;

  transition:

    *background* 0.25s,

    color 0.25s;

}

.btn:hover {

  background: var(--ink);

  color: #fff;

}



.todo {

  list-style: none;

}

.todo li {

  border-bottom: 1px dashed var(--line);

}

.todo button {

  width: 100%;

  text-align: left;

  font: inherit;

  color: inherit;

  background: none;

  border: 0;

  padding: 9px 0;

  cursor: pointer;

}

.todo .box {

  display: inline-block;

  width: 3.2ch;

  font-weight: 700;

}

.todo li.done button span.t {

  text-decoration: line-through;

  color: var(--mute);

}



.digits {

  display: flex;

  gap: 16px;

  font-size: clamp(20.4px, 2.4vw, 32.4px);

  line-height: 1;

}

.digits small {

  display: block;

  font-size: 7.2px;

  letter-spacing: 0.14em;

  color: var(--mute);

  margin-top: 6px;

  text-transform: uppercase;

}

.clock {

  margin-top: 20px;

  border-top: 1px dashed var(--line);

  padding-top: 12px;

  font-size: 9px;

  display: flex;

  justify-content: space-between;

}



.chai {

  width: 100%;

  text-align: center;

  background: none;

  border: 0;

  font: inherit;

  color: inherit;

  cursor: pointer;

}

.chai svg {

  width: 96px;

  height: 96px;

  fill: none;

  stroke: var(--ink);

  stroke-width: 3;

  stroke-linecap: round;

  stroke-linejoin: round;

}

.steam {

  animation: steam 2.2s ease-in-out infinite;

  opacity: 0.6;

}

.steam:nth-of-type(2) {

  animation-delay: 0.5s;

}

@keyframes steam {

  50% {

    transform: translateY(-6px);

    opacity: 1;

  }

}

.chai b {

  display: block;

  font-weight: 400;

  font-size: 32.4px;

  line-height: 1.1;

}

.chai.pop svg {

  animation: pop 0.35s;

}

@keyframes pop {

  50% {

    transform: scale(1.15) rotate(-6deg);

  }

}



.stack {

  position: relative;

  height: 340px;

  max-width: 300px;

  margin: 0 auto;

  cursor: pointer;

}

.pol {

  position: absolute;

  inset: 0 0 auto 0;

  margin: auto;

  width: 78%;

  border: 2px solid var(--ink);

/* scroll reveal: elements fade in as they enter the screen */

const io = new IntersectionObserver(

  (entries) => {

    entries.forEach((e) => {

      if (!e.isIntersecting) return;

      io.unobserve(e.target);

      e.target.classList.add("in");

      if (e.target.classList.contains("proj")) updateActive();

    });

  },

  { threshold: 0.15 },

);

document.querySelectorAll(".reveal, .proj").forEach((el) => io.observe(el));



/* work showcase: the project in the middle of the screen is solid,

   the ones before and after stay a bit transparent */

const projects = [...document.querySelectorAll(".proj")];

function updateActive() {

  if (!projects.length) return;

  const mid = innerHeight / 2;

  let best = null;

  let bestDistance = Infinity;

  projects.forEach((p) => {

    const r = p.getBoundingClientRect();

    const distance = Math.abs(r.top + r.height / 2 - mid);

    if (distance < bestDistance) {

      bestDistance = distance;

      best = p;

    }

  });

  projects.forEach((p) => p.classList.toggle("active", p === best && p.classList.contains("in")));

}

addEventListener("scroll", () => requestAnimationFrame(updateActive), { passive: true });

addEventListener("resize", updateActive);

updateActive();
